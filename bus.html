<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>巴士到站 · 香港天氣 · 出門口倒數</title>
<meta name="description" content="九巴／龍運實時到站、香港天氣及出門口倒數，為 iPhone 而設。">
<meta name="theme-color" content="#e9eef5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b2230" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="巴士 · HK">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" id="appleIcon">
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e2231a'/%3E%3Ctext x='32' y='43' font-size='30' font-family='Arial' font-weight='800' fill='white' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<style>
/* ============ Neumorphism / iPhone first ============ */
:root {
  color-scheme: light;
  --bg:#e9eef5; --surface:#e9eef5;
  --ink:#2b3648; --ink2:#5f6c80; --ink3:#96a2b4;
  --sd:rgba(163,177,198,.62); --sl:rgba(255,255,255,.95);
  --out:8px 8px 18px var(--sd), -8px -8px 18px var(--sl);
  --out-sm:4px 4px 9px var(--sd), -4px -4px 9px var(--sl);
  --out-xs:2px 2px 5px var(--sd), -2px -2px 5px var(--sl);
  --in:inset 5px 5px 10px var(--sd), inset -5px -5px 10px var(--sl);
  --in-sm:inset 3px 3px 6px var(--sd), inset -3px -3px 6px var(--sl);
  --accent:#3b6fe0; --amber:#d98a00; --danger:#e5484d;
  --green:#2ea86b; --blue:#3b82c4; --line:rgba(43,54,72,.09); --radius:28px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme:dark;
    --bg:#1b2230; --surface:#1b2230; --ink:#e9eef7; --ink2:#a9b4c6; --ink3:#78849a;
    --sd:rgba(0,0,0,.58); --sl:rgba(255,255,255,.055);
    --accent:#7ba6ff; --amber:#ffb340; --danger:#ff6b6f; --line:rgba(255,255,255,.08);
  }
}
:root[data-theme="dark"] {
  color-scheme:dark;
  --bg:#1b2230; --surface:#1b2230; --ink:#e9eef7; --ink2:#a9b4c6; --ink3:#78849a;
  --sd:rgba(0,0,0,.58); --sl:rgba(255,255,255,.055);
  --accent:#7ba6ff; --amber:#ffb340; --danger:#ff6b6f; --line:rgba(255,255,255,.08);
}
*{-webkit-tap-highlight-color:transparent} html{-webkit-text-size-adjust:100%} [hidden]{display:none!important}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);overflow-x:hidden;touch-action:manipulation;transition:background .35s ease;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input{font-family:inherit} button{cursor:pointer;color:inherit} button:active{transform:scale(.975)}
.app{max-width:500px;margin:0 auto;box-sizing:border-box;padding:calc(16px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}

/* header */
.hero{padding:4px 5px 0}.hero-top{display:flex;align-items:center;gap:10px}
.brand{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:750;letter-spacing:.14em;color:var(--ink2)}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:live 2.2s infinite}
@keyframes live{60%{box-shadow:0 0 0 6px rgba(46,168,107,0)}100%{box-shadow:0 0 0 0 rgba(46,168,107,0)}}
.hero-date{font-size:11.5px;color:var(--ink3);margin-left:auto;font-variant-numeric:tabular-nums}
.theme-btn,.mini-btn{width:34px;height:34px;flex:none;border:0;border-radius:50%;background:var(--surface);box-shadow:var(--out-xs);display:grid;place-items:center;font-size:14px}
.theme-btn:active,.mini-btn:active{box-shadow:var(--in-sm)}
.a2hs{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:14px;background:var(--surface);box-shadow:var(--out-sm);font-size:11px;color:var(--ink2);line-height:1.45}
.a2hs b{color:var(--ink)} .a2hs button{margin-left:auto;flex:none;border:0;border-radius:999px;padding:4px 10px;background:var(--surface);box-shadow:var(--out-xs);color:var(--ink3);font-size:11px}
.utility-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.util-btn{flex:1;min-width:140px;border:0;border-radius:12px;padding:9px 12px;background:var(--surface);box-shadow:var(--out-sm);color:var(--ink2);font-size:11px;font-weight:650}
.util-btn[aria-pressed="true"]{box-shadow:var(--in-sm);color:var(--accent)}
.util-btn:active{box-shadow:var(--in-sm)}
/* cards */
.stack{display:flex;flex-direction:column;gap:18px;margin-top:20px}
.card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--out)}
.card-head{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.card-head h1,.card-head h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.015em}
.head-ico{width:32px;height:32px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:15px;background:var(--surface);box-shadow:var(--out-xs)}
.wx-ico{color:#f5a623}.head-note{margin-left:auto;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.panel-moves{display:inline-flex;gap:6px;margin-left:2px;flex:none}
.bus .panel-moves{margin-left:auto}
.panel-move-btn{width:28px;height:28px;border:0;border-radius:9px;background:var(--surface);box-shadow:var(--out-xs);color:var(--ink2);font-size:13px;line-height:1;display:grid;place-items:center}
.panel-move-btn:active{box-shadow:var(--in-sm)}
.panel-move-btn:disabled{opacity:.35;box-shadow:none;cursor:default}

/* scenes */
.scenes{display:flex;gap:7px;overflow-x:auto;margin:-2px 0 14px;padding:2px 0 4px;scrollbar-width:none}
.scenes::-webkit-scrollbar{display:none}
.scene{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:7px 12px;background:var(--surface);box-shadow:var(--out-sm);font-size:11.5px;font-weight:650;white-space:nowrap}
.scene.active{box-shadow:var(--in-sm);color:var(--accent)}
.scene .del{font-size:12px;color:var(--ink3);padding:0 1px}
.scene.add{color:var(--ink2)}

/* bus */
.route-badge{min-width:47px;height:47px;flex:none;padding:0 8px;border:0;border-radius:15px;color:#fff;font-size:15px;font-weight:800;
 background:linear-gradient(145deg,#ff5b4e,#e2231a 55%,#bb110c);box-shadow:0 9px 18px rgba(226,35,26,.28),var(--out-xs)}
.route-title{min-width:0;flex:1}.route-title h1{font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route-title p{margin:3px 0 0;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:36px;height:36px;flex:none;border:0;border-radius:50%;background:var(--surface);box-shadow:var(--out-sm);color:var(--ink2);display:grid;place-items:center}
.icon-btn:active{box-shadow:var(--in-sm)} .icon-btn.loading svg{animation:spin .9s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
.service-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.service-tabs button{border:0;border-radius:999px;padding:5px 11px;background:var(--surface);box-shadow:var(--out-xs);font-size:10.5px;font-weight:700;color:var(--ink3)}
.service-tabs button[aria-pressed="true"]{box-shadow:var(--in-sm);color:var(--accent)}
.segmented{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);box-shadow:var(--in-sm);border-radius:14px;padding:4px;margin-bottom:14px}
.seg-thumb{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:calc(100% - 8px);border-radius:11px;background:var(--surface);box-shadow:var(--out-xs);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.segmented[data-active="I"] .seg-thumb{transform:translateX(100%)}
.segmented button{position:relative;z-index:1;border:0;background:none;padding:8px 0;font-size:12.5px;font-weight:650;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segmented button[aria-selected="true"]{color:var(--accent)}
.stop-row{display:flex;gap:8px;align-items:stretch;margin-bottom:14px}
.stop-btn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:9px 11px;border:0;border-radius:16px;background:var(--surface);box-shadow:var(--out-sm)}
.stop-btn:active{box-shadow:var(--in-sm);transform:none}
.stop-pin{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--out-xs);color:var(--accent)}
.stop-text{flex:1;min-width:0}.stop-text small{display:block;font-size:10px;color:var(--ink3);margin-bottom:1px}
.stop-text strong{display:block;font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--ink3);font-size:21px}.loc-main{width:44px;height:auto;border-radius:14px;font-size:16px}

/* integrated ride panel */
.eta-area{min-height:92px}
.ride-panel{border-radius:20px;padding:14px;background:var(--surface);box-shadow:var(--in-sm);display:flex;align-items:center;justify-content:space-between;gap:12px}
.ride-panel.due{box-shadow:var(--in-sm),inset 0 0 0 1px rgba(229,72,77,.42)}
.ride-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.ride-cap{font-size:10px;color:var(--ink3)}
.ride-count{font-size:38px;font-weight:750;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.ride-panel.near .ride-count{color:var(--amber)} .ride-panel.soon .ride-count{color:var(--danger)}
.ride-panel.due .ride-count{font-size:23px;color:var(--danger)}
.ride-note{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-variant-numeric:tabular-nums}
.ride-side{flex:none;text-align:right;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.ride-eta b{font-size:25px;font-weight:750;font-variant-numeric:tabular-nums}
.ride-eta em{font-style:normal;font-size:10px;color:var(--ink3);margin-left:3px}
.ride-time{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(217,138,0,.14);color:var(--amber)}
.ride-status{margin:10px 2px 0;font-size:11px;color:var(--ink3);line-height:1.5}
.link-btn{border:0;background:none;color:var(--accent);font-size:11px;font-weight:700;padding:0 2px;text-decoration:underline}
button,a,input,label,[role="button"]{touch-action:manipulation}
.bus-picker{display:flex;gap:6px;margin-top:12px}
.bus-chip{flex:1;min-width:0;border:0;border-radius:12px;background:var(--surface);box-shadow:var(--out-xs);padding:6px 3px;display:flex;flex-direction:column;align-items:center;gap:1px}
.bus-chip b{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.bus-chip small{font-size:8.5px;color:var(--ink3);white-space:nowrap}
.bus-chip.selected,.bus-chip:active{box-shadow:var(--in-sm);transform:none}.bus-chip.selected b,.bus-chip.selected small{color:var(--accent)}
.ride-rows{margin-top:11px}.ride-row{display:flex;align-items:center;gap:9px;padding:8px 2px;font-size:12.5px;border-bottom:1px solid var(--line)}
.ride-row:last-child{border-bottom:0}.ride-row .t{color:var(--ink2);min-width:46px;font-variant-numeric:tabular-nums}
.ride-row .m{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}.ride-row .m span{font-size:10px;font-weight:500;color:var(--ink3);margin-left:2px}
.alert-bar{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--in-sm),inset 3px 0 0 var(--danger);font-size:13px}
.alert-bar button{margin-left:auto;flex:none;border:0;border-radius:999px;padding:12px 22px;min-height:44px;background:var(--surface);box-shadow:var(--out-sm);color:var(--danger);font-size:14px;font-weight:800;white-space:nowrap}
.alert-bar[hidden]{display:none}
.alert-bar.floating{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:70;width:max-content;max-width:94vw;box-shadow:0 10px 30px rgba(0,0,0,.25),inset 3px 0 0 var(--danger)}
.leave-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.notify-toggle{border:0;border-radius:999px;padding:7px 11px;white-space:nowrap;background:var(--surface);box-shadow:var(--out-sm);color:var(--accent);font-size:11px;font-weight:700}
.notify-toggle[aria-pressed="true"]{box-shadow:var(--in-sm)}
.leave-walk{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink2)}
.stepper{display:inline-flex;align-items:center;gap:5px;padding:4px;border-radius:12px;background:var(--surface);box-shadow:var(--in-sm);font-variant-numeric:tabular-nums}
.stepper button{width:25px;height:25px;border:0;border-radius:9px;background:var(--surface);box-shadow:var(--out-xs);font-size:15px;display:grid;place-items:center}
.stepper button:active{box-shadow:var(--in-sm)} .stepper strong{min-width:12px;text-align:center;font-size:13px}.stepper span{font-size:10px;color:var(--ink3);margin-right:4px}
.eta-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink3)}
.auto-tag{display:inline-flex;align-items:center;gap:5px}.auto-tag i{width:5px;height:5px;border-radius:50%;background:var(--green);animation:fade 2.4s infinite}@keyframes fade{50%{opacity:.3}}

/* weather */
.warning{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;margin-bottom:13px;border-radius:15px;background:var(--surface);box-shadow:var(--in-sm),inset 3px 0 0 var(--amber);font-size:12px;line-height:1.5}
.warning b{display:block;font-size:12.5px;margin-bottom:1px}.warning p{margin:0;color:var(--ink2)}
.wx-now{display:flex;align-items:center;gap:12px;margin-bottom:10px}.wx-icon{font-size:38px;line-height:1}
.wx-now-copy{flex:1;min-width:0}.wx-now-copy strong{display:block;font-size:16px;font-weight:700}.wx-now-copy .loc-link{padding:0;border:0;background:none;color:var(--ink3);font-size:10.5px;text-align:left}
.wx-cur{font-size:31px;font-weight:700;font-variant-numeric:tabular-nums}.wx-cur sup{font-size:11px;color:var(--ink2);margin-left:2px;vertical-align:12px}
.wx-range{font-size:25px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-bottom:4px}
.wx-umbrella{font-size:11.5px;color:var(--ink2);margin-bottom:14px;min-height:16px}
.wx-hours-title{font-size:10.5px;color:var(--ink3);margin:0 0 7px 2px}
.wx-hours{display:flex;gap:8px;overflow-x:auto;padding:2px 0 5px;margin:0 -2px;scrollbar-width:none}
.wx-hours::-webkit-scrollbar{display:none}
.hour{flex:0 0 58px;border-radius:15px;padding:8px 4px;background:var(--surface);box-shadow:var(--out-sm);display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.hour.now{box-shadow:var(--in-sm)}.hour .ht{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums}
.hour .hi{font-size:19px;line-height:1.15}.hour .hp{font-size:10px;color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums}
.hour .hc{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}.hour-empty{font-size:11px;color:var(--ink3);padding:10px 2px}

/* sheets */
.sheet-backdrop{position:fixed;inset:0;z-index:40;background:rgba(8,12,22,.38);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;transition:opacity .25s}
.sheet-backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;max-height:88dvh;padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -14px 40px var(--sd);transform:translateY(101%);transition:transform .36s cubic-bezier(.32,.72,0,1);visibility:hidden}
.sheet.show{transform:translateY(0);visibility:visible}
@media(min-width:560px){.sheet{left:50%;right:auto;bottom:18px;width:470px;border-radius:28px;transform:translate(-50%,calc(100% + 30px))}.sheet.show{transform:translate(-50%,0)}}
.grab{width:38px;height:5px;border-radius:99px;background:var(--ink3);opacity:.35;margin:9px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 20px 4px;flex:none}.sheet-head h2{margin:0;font-size:17px;font-weight:700}
.close-btn{margin-left:auto;width:30px;height:30px;border:0;border-radius:50%;background:var(--surface);box-shadow:var(--out-xs);color:var(--ink2);font-size:12px;display:grid;place-items:center}
.sheet-body{padding:8px 20px 22px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.search-wrap{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:14px;background:var(--surface);box-shadow:var(--in-sm);color:var(--ink3)}
.search-wrap input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;color:var(--ink)}
.search-wrap input::placeholder{color:var(--ink3)}.search-wrap input::-webkit-search-cancel-button{-webkit-appearance:none}
.loc-btn{display:flex;align-items:center;gap:8px;width:100%;margin:12px 0 6px;padding:11px 13px;border:0;border-radius:14px;background:var(--surface);box-shadow:var(--out-sm);color:var(--accent);font-size:13px;font-weight:650;text-align:left}
.loc-btn:disabled{opacity:.6}
.group-label{font-size:10px;color:var(--ink3);letter-spacing:.06em;margin:12px 2px 4px}
.pick-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 8px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font-size:14px;text-align:left}
.pick-item:last-child{border-bottom:0}.pick-item[aria-selected="true"]{color:var(--accent);font-weight:650;border-radius:12px;box-shadow:var(--in-sm);border-bottom-color:transparent}
.pick-item .seq,.pick-item .rnum{min-width:38px;font-size:11px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
.pick-item .rnum{font-size:14px;font-weight:800;color:var(--ink)}.pick-item .nm,.pick-item .ptext{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-item .ptext small{display:block;font-size:10px;color:var(--ink3);font-weight:400;margin-top:2px}
.pick-item .dist{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums}.pick-item .tick{font-size:13px;color:var(--accent)}
.star-btn{width:28px;height:28px;flex:none;border:0;border-radius:50%;background:var(--surface);box-shadow:var(--out-xs);font-size:13px;line-height:1}
.star-btn.on{color:var(--amber);box-shadow:var(--in-sm)}
.district-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:8px}
.district-grid button{border:0;border-radius:13px;padding:10px 4px;background:var(--surface);box-shadow:var(--out-xs);font-size:12px;font-weight:650;color:var(--ink2)}
.district-grid button[aria-pressed="true"]{box-shadow:var(--in-sm);color:var(--accent)}
.list-empty{padding:22px 0;text-align:center;color:var(--ink3);font-size:13px}

/* misc */
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));z-index:60;max-width:84vw;padding:10px 16px;border-radius:999px;background:rgba(20,25,35,.94);color:#fff;font-size:12.5px;text-align:center;opacity:0;transform:translate(-50%,14px);pointer-events:none;transition:.25s;backdrop-filter:blur(10px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{margin-top:22px;text-align:center;font-size:10px;line-height:1.8;color:var(--ink3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media(max-width:380px){.ride-count{font-size:33px}.ride-eta b{font-size:21px}.ride-panel{padding:12px}.card{padding:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body>

<script>
'use strict';
const VERSION='1.0.3';
/* ===== config ===== */
const API = {
  routes: 'https://data.etabus.gov.hk/v1/transport/kmb/route/',
  stops: 'https://data.etabus.gov.hk/v1/transport/kmb/stop',
  stop: (id) => `https://data.etabus.gov.hk/v1/transport/kmb/stop/${id}`,
  routeStop: (r, b, s) => `https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${r}/${b==='I'?'inbound':'outbound'}/${s}`,
  eta: (id) => `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${id}`,
  wx: (t) => `https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=${t}&lang=tc`,
  hourly: (lat, lng) => `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,weather_code&hourly=temperature_2m,precipitation_probability,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=Asia%2FHong_Kong&forecast_days=2`,
};
const KEYS = {
  current:'hkbus.v2.current', routes:'hkbus.v2.routes', stopMap:'hkbus.v2.stopmap',
  routePrefs:'hkbus.v2.routePrefs', stopByKey:'hkbus.v2.stopByKey',
  walk:'hkbus.v2.walk',
  pos:'hkbus.v2.pos', weather:'hkbus.v2.weather', hourly:'hkbus.v2.hourly', weatherLoc:'hkbus.v2.weatherLoc',
  panelOrder:'hkbus.v2.panelOrder',
  theme:'hkbus.v2.theme', a2hs:'hkbus.v2.a2hs',
  notify:'hkbus.v2.notify', wake:'hkbus.v2.wake',
  favRoutes:'hkbus.v2.favRoutes', favStops:'hkbus.v2.favStops', recentRoutes:'hkbus.v2.recentRoutes',
  scenes:'hkbus.v2.scenes', activeScene:'hkbus.v2.activeScene', alert:'hkbus.v2.alert', etaCache:'hkbus.v2.etaCache',
};
const HK_TZ = 'Asia/Hong_Kong', HK_DEFAULT = { lat:22.3027, lng:114.1772 };
const REFRESH_ETA_MS = 20000, REFRESH_WX_MS = 10*60*1000, DAY_MS = 86400000;
const DISTRICTS = [
  { n:'中西區', lat:22.282, lng:114.145 }, { n:'灣仔', lat:22.277, lng:114.170 },
  { n:'東區', lat:22.286, lng:114.218 }, { n:'南區', lat:22.247, lng:114.160 },
  { n:'油尖旺', lat:22.307, lng:114.171 }, { n:'深水埗', lat:22.330, lng:114.160 },
  { n:'九龍城', lat:22.320, lng:114.185 }, { n:'黃大仙', lat:22.340, lng:114.200 },
  { n:'觀塘', lat:22.320, lng:114.225 }, { n:'葵青', lat:22.350, lng:114.135 },
  { n:'荃灣', lat:22.370, lng:114.120 }, { n:'屯門', lat:22.390, lng:114.000 },
  { n:'元朗', lat:22.440, lng:114.030 }, { n:'北區', lat:22.490, lng:114.140 },
  { n:'大埔', lat:22.450, lng:114.165 }, { n:'沙田', lat:22.400, lng:114.190 },
  { n:'西貢', lat:22.380, lng:114.270 }, { n:'離島區', lat:22.260, lng:114.000 },
];
const WARN_NAMES = { WTS:'雷暴警告',WRAIN:'暴雨警告',WFIRE:'火災危險警告',WCOLD:'寒冷天氣警告',WHOT:'酷熱天氣警告',WFG:'山泥傾瀉警告',WTCSGNL:'熱帶氣旋警告',WMSGNL:'強烈季候風信號',WTMW:'海嘯警告',WFROST:'霜凍警告' };

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const pad2 = (n) => String(n).padStart(2,'0');
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateFmt = new Intl.DateTimeFormat('zh-HK',{timeZone:HK_TZ,month:'long',day:'numeric',weekday:'long'});
const hmFmt = new Intl.DateTimeFormat('zh-HK',{timeZone:HK_TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const hmsFmt = new Intl.DateTimeFormat('zh-HK',{timeZone:HK_TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
const timeOf = (ts) => hmFmt.format(new Date(ts));
const timeWithSec = (ts) => hmsFmt.format(new Date(ts));
function hkParts(date = new Date()) {
  const o = {};
  for (const p of new Intl.DateTimeFormat('en-GB',{timeZone:HK_TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(date)) if (p.type!=='literal') o[p.type]=p.value;
  return o;
}
function hkLocalISO() { const p=hkParts(); return `${p.year}-${p.month}-${p.day}T${p.hour}:00`; }
function wxEmoji(code) {
  const c=Number(code);
  if (c>=90&&c<=91) return c===90?'🥵':'🥶';
  if (c===92) return '❄️'; if (c>=83) return '🌫️'; if (c===80) return '💨';
  if (c>=63&&c<=65) return '⛈️'; if (c===62) return '🌧️';
  if (c>=60&&c<=61) return '🌦️'; if (c===54) return '☁️';
  if (c===52||c===53) return '⛅️'; if (c===50||c===51) return '☀️';
  return '🌤️';
}
function wxCodeEmoji(code) {
  const c=Number(code);
  if (c===0) return '☀️'; if (c<=2) return '🌤️'; if (c===3) return '☁️';
  if (c===45||c===48) return '🌫️'; if (c>=51&&c<=57) return '🌦️';
  if (c>=61&&c<=67) return '🌧️'; if (c>=71&&c<=77) return '🌨️';
  if (c>=80&&c<=82) return '🌦️'; if (c===85||c===86) return '🌨️';
  if (c>=95) return '⛈️'; return '🌤️';
}
function haversine(a,b) {
  const R=6371000, rad=d=>d*Math.PI/180, dLat=rad(b.lat-a.lat), dLon=rad(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function fmtDistance(m) { return m<1000 ? `${Math.round(m/10)*10} 米` : `${(m/1000).toFixed(1)} 公里`; }
function nearestDistrict(pos) {
  if (!pos) return null;
  return DISTRICTS.map(d=>({d,dist:haversine(pos,d)})).sort((a,b)=>a.dist-b.dist)[0].d.n;
}

/* ===== state ===== */
const state = {
  route:'1', bound:'O', serviceType:'1',
  routeList:[], routeAt:0, stopMap:{}, stopMapReady:false,
  stops:[], stopId:null, stopByKey:{}, routePrefs:{}, stopsError:null,
  etas:[], etaFetchedAt:0, etaLoading:false, etaError:null, selectedBus:0,
  userPos:null, walkMin:5,
  favRoutes:[], favStops:[], recentRoutes:[], scenes:[], activeScene:null,
  theme:'auto', weather:null, hourly:null, weatherLoc:'auto',
  panelOrder:['bus','weather','hourly'],
  alertOn:false, audioCtx:null, alertAudio:null, alertPool:[], alertIndex:0, audioUnlocked:false, dueSince:0, alertSuppressedTarget:null, countdownEnabled:false, wakeLock:null, wakeLockWanted:false, notifyEnabled:true, leaveNotifiedTarget:null,
};
let etaToken=0, wxToken=0, hourlyToken=0, toastTimer=null, alertTimer=null;
function readJSON(k,f){ try { const s=localStorage.getItem(k); return s?JSON.parse(s):f; } catch { return f; } }
function writeJSON(k,v){ try { localStorage.setItem(k,JSON.stringify(v)); } catch {} }
function saveCurrent() { writeJSON(KEYS.current,{route:state.route,bound:state.bound,serviceType:state.serviceType}); }
function routeKey() { return `${state.route}|${state.bound}|${state.serviceType}`; }

/* ===== prefs / migration ===== */
const PANEL_IDS=['bus','weather','hourly'];
function normalizePanelOrder(order) {
  const base=Array.isArray(order)?order.filter(id=>PANEL_IDS.includes(id)):[];
  const out=[];
  for (const id of base) if (!out.includes(id)) out.push(id);
  for (const id of PANEL_IDS) if (!out.includes(id)) out.push(id);
  return out;
}
function applyPanelOrder(order=state.panelOrder, persist=false) {
  state.panelOrder=normalizePanelOrder(order);
  const stack=$('.stack'); if (!stack) return;
  for (const id of state.panelOrder) {
    const el=document.querySelector(`[data-panel="${id}"]`);
    if (el) stack.appendChild(el);
  }
  $$('.panel-move-btn').forEach(btn=>{
    const id=btn.dataset.movePanel, dir=btn.dataset.dir;
    const idx=state.panelOrder.indexOf(id);
    btn.disabled=(dir==='up'&&idx<=0) || (dir==='down'&&idx===state.panelOrder.length-1);
  });
  if (persist) writeJSON(KEYS.panelOrder,state.panelOrder);
}
function movePanel(id,dir) {
  const order=state.panelOrder.slice();
  const i=order.indexOf(id); if (i<0) return;
  const j=dir==='up'?i-1:i+1;
  if (j<0||j>=order.length) return;
  [order[i],order[j]]=[order[j],order[i]];
  applyPanelOrder(order,true);
  const name=id==='bus'?'巴士到站':id==='weather'?'香港天氣':'未來 24 小時';
  toast(`${name}已${dir==='up'?'上移':'下移'}`);
}
function purgeLegacyPrefs() {
  try {
    Object.keys(localStorage).filter(k=>/^hk\d+\./.test(k)).forEach(k=>localStorage.removeItem(k));
  } catch {}
}
function loadPrefs() {
  const cur=readJSON(KEYS.current,null);
  if (cur && typeof cur.route==='string') {
    state.route=cur.route; state.bound=cur.bound==='I'?'I':'O'; state.serviceType=String(cur.serviceType||'1');
  } else {
    state.route='1'; state.bound='O'; saveCurrent();
  }
  state.routePrefs=readJSON(KEYS.routePrefs,{}) || {};
  state.stopByKey=readJSON(KEYS.stopByKey,{}) || state.stopByKey;
  const walk=readJSON(KEYS.walk,null); if (Number.isFinite(walk)) state.walkMin=clampWalk(walk);
  state.pos=readJSON(KEYS.pos,null);
  if (state.pos && Number.isFinite(state.pos.lat) && Number.isFinite(state.pos.lng)) state.userPos=state.pos;
  const wl=readJSON(KEYS.weatherLoc,'auto');
  state.weatherLoc=(wl==='auto'||DISTRICTS.some(d=>d.n===wl))?wl:'auto';
  state.favRoutes=readJSON(KEYS.favRoutes,[])||[]; state.favStops=readJSON(KEYS.favStops,[])||[];
  state.recentRoutes=readJSON(KEYS.recentRoutes,[])||[];
  state.theme=localStorage.getItem(KEYS.theme)||'auto';
  if (!['auto','light','dark'].includes(state.theme)) state.theme='auto';
  const po=readJSON(KEYS.panelOrder,null);
  state.panelOrder=normalizePanelOrder(po);
  state.notifyEnabled=true;
  state.wakeLockWanted=readJSON(KEYS.wake,false)===true;
  state.scenes=readJSON(KEYS.scenes,null);
  if (!Array.isArray(state.scenes) || !state.scenes.length) {
    state.scenes=[];
    writeJSON(KEYS.scenes,state.scenes);
  }
  state.activeScene=localStorage.getItem(KEYS.activeScene)||null;
}
function ensureValidRoute() {
  if (!state.routeList.length) return;
  if (!state.routeList.some(r=>r.route===state.route)) {
    state.route=state.routeList.some(r=>r.route==='1')?'1':state.routeList[0].route;
    const opts=state.routeList.filter(r=>r.route===state.route);
    state.bound=opts[0].bound; state.serviceType=String(opts[0].service_type||'1'); saveCurrent();
  }
  const opts=state.routeList.filter(r=>r.route===state.route);
  if (!opts.some(r=>r.bound===state.bound&&String(r.service_type)===state.serviceType)) {
    state.bound=opts[0].bound; state.serviceType=String(opts[0].service_type||'1'); saveCurrent();
  }
}

/* ===== icons / theme / a2hs ===== */
function installIcons() {
  const svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='#e2231a'/><rect x='118' y='92' width='276' height='320' rx='58' fill='#fff'/><rect x='146' y='126' width='220' height='188' rx='30' fill='#e2231a'/><circle cx='180' cy='352' r='30' fill='#2b3648'/><circle cx='332' cy='352' r='30' fill='#2b3648'/><path d='M168 214h176' stroke='#fff' stroke-width='18' stroke-linecap='round'/></svg>";

}
function makeBeepURI() {
  try {
    const rate=8000, dur=.46, n=Math.floor(rate*dur), buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
    const put=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };

function beepContext() {

}

  const max=valid.length?Math.max(...valid):null;
  if (max==null) return {text:'降雨數據載入中…',icon:'🌤️',max:null};
  if (max>=50) return {text:'而家落大雨',icon:'🌧️',max};
  if (max>=10) return {text:'而家落雨',icon:'🌧️',max};

function renderWeatherError() {
  $('#wxRain').textContent='暫時無法取得天氣'; $('#wxTemp').textContent='--';
  $('#wxRange').textContent='--° / --°'; $('#wxUmbrella').textContent='請檢查網絡'; $('#wxHours').innerHTML='<span class="hour-empty">暫時沒有資料</span>';
}
function renderHourlyError() { const box=$('#wxHours'); if (!box.textContent.trim()||box.textContent.includes('載入中')) box.innerHTML='<span class="hour-empty">暫時沒有逐小時資料</span>'; }

/* ===== date labels / toast ===== */
function updateDateLabels() { $('#heroDate').textContent=dateFmt.format(new Date()); }
function toast(msg) {
  const el=$('#toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2600);
}
function tick() { tickEtas(); tickLeave(); }
/* ===== events ===== */
function bindEvents() {
  $('#themeBtn').addEventListener('click',cycleTheme);
  $('#a2hsClose').addEventListener('click',closeA2HS);
  $('#routeBtn').addEventListener('click',openRouteSheet);
  $('#stopBtn').addEventListener('click',openStopSheet);
  $('#locMainBtn').addEventListener('click',()=>locateForStops(true));
  $('#locBtn').addEventListener('click',()=>locateForStops(false));
  $('#wxLoc').addEventListener('click',openWeatherSheet);
  $('#refreshBtn').addEventListener('click',()=>{ refreshEta(); toast('正在更新班次…'); });
  $('#wakeBtn').addEventListener('click',toggleWakeLock);
  $('#notifyBtn').addEventListener('click',toggleNotify);
  ['pointerdown','touchstart','click'].forEach(ev=>document.addEventListener(ev,unlockAudio,{once:true,passive:true}));
  ['pointerdown','touchstart','click'].forEach(ev=>document.addEventListener(ev,()=>{ ensureAudio(); state.audioUnlocked=true; },{passive:true}));
  $('#soundTestBtn').addEventListener('click',()=>{
    unlockAudio(); beep(); buzz();
    toast(navigator.vibrate?'已播放測試提示音及震動':'已播放測試提示音（此瀏覽器不支援震動）');
  });
  $$('.panel-move-btn').forEach(btn=>btn.addEventListener('click',()=>movePanel(btn.dataset.movePanel,btn.dataset.dir)));
  $('#sceneBar').addEventListener('click',(e)=>{
    const del=e.target.closest('[data-del-scene]');
    if (del) { e.stopPropagation(); deleteScene(del.dataset.delScene); return; }
    const add=e.target.closest('[data-add-scene]');
    if (add) { saveCurrentScene(); return; }
    const sc=e.target.closest('[data-scene]');
    if (sc) applyScene(sc.dataset.scene);
  });
  $('#dirTabs').addEventListener('click',(e)=>{ const b=e.target.closest('[data-bound]'); if(b) setBound(b.dataset.bound); });
  $('#serviceTabs').addEventListener('click',(e)=>{ const b=e.target.closest('[data-service]'); if(b) setServiceType(b.dataset.service); });
  $('#walkMinus').addEventListener('click',()=>adjustWalk(-1));
  $('#walkPlus').addEventListener('click',()=>adjustWalk(1));
  $('#calendarBtn').addEventListener('click',addCalendarReminder);
  $('#countdownBtn').addEventListener('click',toggleCountdown);
  $('#etaArea').addEventListener('click',(e)=>{
    const pick=e.target.closest('[data-eta-pick]');
    if (pick) { state.selectedBus=Number(pick.dataset.etaPick)||0; renderEta(); tickEtas(); tickLeave(); return; }
    const act=e.target.closest('[data-action]');
    if (!act) return;
    if (act.dataset.action==='retry') refreshEta();
    if (act.dataset.action==='stop-alert') stopLeaveAlert();
  });
  $('#alertBar').addEventListener('click',(e)=>{ if(e.target.closest('[data-action="stop-alert"]')) stopLeaveAlert(); });
  $('#routeSearch').addEventListener('input',(e)=>renderRouteList(e.target.value));
  $('#stopSearch').addEventListener('input',(e)=>renderStopList(e.target.value));
  $('#routeSheet').addEventListener('click',(e)=>{
    const star=e.target.closest('[data-star]');
    if (star) { e.stopPropagation(); const on=toggleFav(star.dataset.star,star.dataset.starId); toast(on?'已加入常用':'已移除書籤'); renderRouteList($('#routeSearch').value); return; }
    const row=e.target.closest('[data-route]'); if(row) setRoute(row.dataset.route);
  });
  $('#stopSheet').addEventListener('click',(e)=>{
    const star=e.target.closest('[data-star]');
    if (star) { e.stopPropagation(); const on=toggleFav(star.dataset.star,star.dataset.starId); toast(on?'已加入常用':'已移除書籤'); renderStopList($('#stopSearch').value); return; }
    const row=e.target.closest('[data-stop]'); if(row) selectStop(row.dataset.stop);
  });
  $('#weatherSheet').addEventListener('click',(e)=>{ const b=e.target.closest('[data-district]'); if(b) setWeatherLoc(b.dataset.district); });
  $('#sheetBackdrop').addEventListener('click',()=>closeSheet());
  $$('[data-close-sheet]').forEach(b=>b.addEventListener('click',()=>closeSheet()));
  document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'&&openSheetEl) closeSheet(); });
}
</script>
</body>
</html>
